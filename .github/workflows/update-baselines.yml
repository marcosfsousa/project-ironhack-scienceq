# Regenerates the committed Playwright pixel baselines on the same runner that
# compares them (issue #89, option 1).
#
# Generating them anywhere else does not work, and this was measured rather than
# assumed: baselines built in mcr.microsoft.com/playwright:v1.62.0-noble differ
# from ubuntu-latest by up to 7% of a full-page shot. No diff tolerance can
# absorb that without also hiding real regressions — a 3px heading change
# measures 0.02.
#
# The cause is glyph fallback, not webfont availability. Both environments load
# IBM Plex fine (probed: document.fonts.check() is true inside the container),
# and the suite now serves the webfont from a committed fixture anyway. But the
# `→` in the Hero suggestion rows is not in IBM Plex, so each host substitutes a
# different *system* font, and the substituted glyph's advance width shifts
# every character after it on that line. Self-hosting the webfont does not fix
# that, which is why this workflow exists rather than being obviated.
#
# Usage — either:
#   * push a commit whose message contains [baselines], or
#   * run this workflow manually from the Actions tab (once it is on main).
# Then download the `playwright-baselines` artifact and commit its contents to
# frontend/tests/visual.spec.ts-snapshots/. Review the diff: every changed PNG
# is a UI change you are approving.
name: Update visual baselines

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

# Matches ci.yml's posture: two [baselines] pushes in quick succession would
# otherwise both run to completion and race to publish the artifact.
concurrency:
  group: update-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    name: Regenerate baselines
    # Manual runs always; pushes only when the commit asks for it, so this does
    # not add a runner to every branch push.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baselines]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Every step below is kept identical to ci.yml's `ui-tests` job. That is
      # the whole point: baselines are only valid if the environment that writes
      # them matches the one that later compares them.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Only the two projects that own baselines — preview-smoke sets
      # ignoreSnapshots, so running it would regenerate nothing.
      #
      # Note this does NOT avoid the preview build: `previewEnabled` keys off
      # process.env.CI alone and the webServer array is independent of
      # --project, so Actions still runs `npm run build && vite preview`.
      # Skipping the project is not skipping its server.
      - name: Regenerate baselines
        run: npx playwright test --update-snapshots --project=desktop --project=mobile

      # `always()` is load-bearing. Without it the upload inherits the default
      # success() and a single red test discards all eight regenerated PNGs,
      # including the ones that regenerated correctly. That is the normal case,
      # not a corner one: you regenerate because the UI changed deliberately,
      # and a deliberate change usually trips a DOM assertion in the same spec
      # before snap() is ever reached — rename the Hero heading and
      # getByRole("heading", …) throws first. Any flake in the ~40 other tests
      # this run executes has the same effect.
      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-baselines
          path: frontend/tests/visual.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: error
