# Pull-request gate for the four seams this project checks: the backend
# pytest suite, the serving image's build-and-import, the frontend
# typecheck-and-build, and the Playwright UI suite. Each seam is one job, so a
# red check names the layer that broke without opening logs.
#
# Job `name:` values are the status-check identifiers used for branch
# protection. Treat them as a stable contract — renaming one silently
# detaches any required-check configuration pointing at it.
#
# Since #90 that is no longer only a warning. All four names are required
# checks on `main` (.github/rulesets/main.json), and merging to `main` deploys,
# so a detached rule is an unprotected production branch that still shows a
# green tick. tests/test_required_checks.py holds the two files equal in both
# directions: a renamed job fails as a missing context, and a job added here
# without a matching context fails as an ungated seam — which is the state the
# api-image job below was in for the length of one PR (#87, #88).
#
# The ruleset is applied through the API and that file is the record of it, not
# the enforcement. Re-export after any change made in the web UI, or the record
# and the rule drift apart with nothing to notice.
#
# No secrets are configured here, deliberately. The suites are offline
# (external clients are lazily constructed, the UI tests mock at the network
# boundary), so a keyless run is a standing assertion that they stay offline:
# a test that acquires a live-service dependency fails here even when it
# passes on a developer machine with a populated .env. The api-image job
# extends that assertion to the artifact that actually deploys — it imports
# the app inside a container with no environment at all.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede a running build when a PR gets a new commit, so the newest commit
# is what the checks report. Pushes to main are never cancelled — every commit
# on the baseline gets its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    # The suite runs in seconds; the budget is almost entirely dependency
    # install. Anything past this is stuck, not slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 3.11 matches the FastAPI service's deploy image (Dockerfile).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt is the deploy manifest — installing it unchanged keeps
      # CI faithful to the runtime image. pytest is the one thing the tests need
      # that the image must not carry, so it is added separately, pinned to the
      # version in requirements-dev.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1

      # Discovery over tests/, never an enumerated list, so a new test file
      # cannot be silently omitted — tests/run_all_tests.py discovers the same
      # way, so a local run and this one collect the same set. Run from the repo
      # root, since tests/ is a relative path; one session for the whole
      # directory also keeps collection-order bugs catchable.
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  api-image:
    name: API image (build + import)
    runs-on: ubuntu-latest
    # Almost entirely `pip install -r requirements.txt` inside the build. The
    # import itself is seconds. Anything past this is a stuck build, not a slow
    # one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The gap this closes: until now CI built no image (#39, #52), so nothing
      # here ever executed Dockerfile. The backend job above installs
      # requirements.txt on a bare runner against a full checkout, which is a
      # different thing from the image — it never exercises the COPY allowlist,
      # so a module the app imports but the image does not carry resolves fine
      # in CI and fails at container start.
      #
      # That is not hypothetical. Dockerfile's COPY list is an enumerated
      # allowlist, and #52 narrows `COPY pipeline/ pipeline/` to the four
      # modules the API path actually reaches — after which adding an import to
      # live_ingest breaks the image at *import* time with nothing in the repo
      # to catch it. Merging to main deploys to Cloud Run, so without this job
      # that surfaces at deploy rather than on the PR.
      - name: Build the serving image
        run: docker build -t scienceq-api:ci .

      # `import api.main` is the whole assertion, and it is a deliberate floor
      # rather than a smoke test of behaviour: it walks the real import graph —
      # api → agent → pipeline, across the sys.path bridge in api/__init__.py —
      # inside the image, which is exactly the graph an enumerated COPY can
      # break. This is the same command #42 verified by hand; this job is that
      # check made standing.
      #
      # No `-e` and no secrets, matching the header: every module-level env read
      # in the import chain uses os.getenv with a default and every external
      # client is lazily constructed, so a keyless import is the assertion that
      # this stays true. An import that starts needing a key fails here.
      - name: Smoke-import the app
        run: docker run --rm scienceq-api:ci python -c "import api.main"

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # 24 matches the web image's build stage (Dockerfile.web). Move this, the
      # ui-tests job below, and the Dockerfile together — a split leaves CI
      # testing a runtime the image does not use.
      #
      # Not picked to clear what is installed at this commit: vite 6.4.3 asks
      # for `^18.0.0 || ^20.0.0 || >=22.0.0` and @vitejs/plugin-react 4.7.0 for
      # `^14.18.0 || >=16.0.0`, both of which Node 20 already satisfied. It is
      # picked because 20 went EOL on 2026-04-30, and because the vite 8 /
      # plugin-react 6 bump in #98 raises the declared floor to
      # `^20.19.0 || >=22.12.0` (#91) — which 20 clears only for as long as the
      # resolved 20.x happens to be recent enough. The second reason is the one
      # that outlives this commit.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Two tsc passes, because one does not cover the tree. `tsc -b` builds
      # tsconfig.json alone ("include": ["src"]) — neither config is composite
      # and neither declares references, so build mode has no project graph to
      # walk. The second pass covers tsconfig.node.json's include set: the vite,
      # playwright and tailwind configs plus tests/. Those are loaded by a
      # transpiler that strips types without checking them, so until this step
      # a type error in any of them failed nowhere (#81).
      #
      # Which transpiler is not the point, and this comment used to name one:
      # it said esbuild, true when #81 wrote it and false as of the vite 8 bump
      # in #98, which took esbuild out of the tree entirely (82 lock references
      # down to 2, both unmet optional peers) in favour of rolldown/Oxc. The
      # reason survives the swap — none of them typecheck — so the argument is
      # stated without the name to avoid the next bump falsifying it again.
      - name: Typecheck
        run: npm run typecheck

      # `npm run build` is `tsc -b && vite build`, the same command
      # Dockerfile.web runs — left intact so the image build keeps typechecking
      # src/ as it already did, and so CI has no build path of its own. That
      # repeats the src pass; a few seconds here, versus the image silently
      # losing a guarantee.
      - name: Build
        run: npm run build

  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    # Bounded mainly to cap a Vite dev server that starts but never serves —
    # webServer would otherwise wait, and the job would hold a runner for the
    # 6-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Kept identical to frontend-build's — see the note there.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are large and version-locked to @playwright/test, so
      # they cache on that version alone. System libraries live outside this
      # path and are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts boots the Vite dev server itself; nothing extra to
      # start here. The suite mocks /api/* at the network boundary, so no
      # backend and no keys are involved.
      - name: Run Playwright suite
        run: npm run test:e2e

      # The report and the retained traces are the only way to diagnose a
      # failure that will not reproduce locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
