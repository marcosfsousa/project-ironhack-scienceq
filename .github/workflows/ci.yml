# Pull-request gate for the three test seams the project already has:
# the backend pytest suite, the frontend typecheck-and-build, and the
# Playwright UI suite. Each seam is one job, so a red check names the layer
# that broke without opening logs.
#
# Job `name:` values are the status-check identifiers used for branch
# protection. Treat them as a stable contract — renaming one silently
# detaches any required-check configuration pointing at it.
#
# No secrets are configured here, deliberately. The suites are offline
# (external clients are lazily constructed, the UI tests mock at the network
# boundary), so a keyless run is a standing assertion that they stay offline:
# a test that acquires a live-service dependency fails here even when it
# passes on a developer machine with a populated .env.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede a running build when a PR gets a new commit, so the newest commit
# is what the checks report. Pushes to main are never cancelled — every commit
# on the baseline gets its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 matches the FastAPI service's deploy image (Dockerfile).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt is the deploy manifest — installing it unchanged keeps
      # CI faithful to the runtime image. pytest is the one thing the tests need
      # that the image must not carry, so it is added separately, pinned to the
      # version in requirements-dev.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.0.2

      # Discovery over tests/, not the curated list in tests/run_all_tests.py,
      # so a new test file cannot be silently omitted. Run from the repo root:
      # the suite's imports resolve the agent/ and pipeline/ packages relative
      # to it, and one session keeps collection-order bugs catchable.
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 20 matches the web image's build stage (Dockerfile.web).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build` — typecheck and bundle in the
      # one command developers already run. No CI-only build path.
      - name: Typecheck and build
        run: npm run build

  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are large and version-locked to @playwright/test, so
      # they cache on that version alone. System libraries live outside this
      # path and are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts boots the Vite dev server itself; nothing extra to
      # start here. The suite mocks /api/* at the network boundary, so no
      # backend and no keys are involved.
      - name: Run Playwright suite
        run: npm run test:e2e

      # The report and the retained traces are the only way to diagnose a
      # failure that will not reproduce locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
