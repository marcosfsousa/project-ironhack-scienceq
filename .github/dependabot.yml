# Watches the pinned dependency manifests for successor releases (#40).
#
# Why this file exists: #37 pinned the last four floating direct imports, and
# the rest of requirements.txt was already pinned. Pinning is the right call —
# a silent major bump landing in the serving image on a rebuild is the worse
# failure — but it only pays if something notices when a successor ships.
# Before this file, nothing did: every version in the deploy manifest stayed
# frozen until a human edited the line.
#
# This file is only half the coverage, and the half it is not lives outside
# the repo. It configures *version* updates: the scheduled sweep below, which
# opens a PR when a newer release exists, whatever the reason for it.
# *Security* updates — the immediate PR triggered by a Dependabot alert on a
# published CVE — are a repository setting under Settings → Code security, not
# a config file, so nothing here can assert or restore them. Both alerts and
# security updates were switched on for this repo on 2026-07-28, alongside this
# commit; before that they were off, which meant a CVE published on a Tuesday
# waited for the Monday sweep. If that toggle is ever flipped back, this file
# silently degrades to exactly that six-day worst case rather than failing.
#
# Base images are deliberately not watched. The inventory is four FROM lines
# across three files, not three — Dockerfile.web is multi-stage:
#
#   Dockerfile           python:3.11-slim
#   Dockerfile.pipeline  python:3.11-slim
#   Dockerfile.web       node:24-alpine   (build stage)
#   Dockerfile.web       nginx:alpine     (runtime stage — what actually serves)
#
# The pythons and the node carry a deliberate major, chosen rather than
# tracked. They are not chosen the same way, which an earlier version of this
# paragraph flattened into one clause. The pythons match a runtime: Cloud
# Run's. The node matches nothing downstream — it is a build stage whose
# output is a static bundle nginx serves, so no runtime is waiting on it. What
# picks its major is the floor the frontend build tooling declares in its own
# `engines.node`, plus the Node release schedule: 20 was taken to EOL on
# 2026-04-30 while still pinned here, and 24 (#91) is the current LTS with the
# longest runway over the `^20.19.0 || >=22.12.0` that vite 8 and
# @vitejs/plugin-react 6 declare once #98 installs them. Either way a bot
# proposing 3.12 or node 26 is proposing a migration, not applying a patch, so
# that stays a human decision — and for the node, one that starts by reading
# the `engines.node` of vite and @vitejs/plugin-react, then the LTS calendar.
# Not `frontend/package.json`'s engines field: that one is this pin restated,
# so consulting it to choose the next pin only quotes the current answer back.
# nginx is
# the odd one out and is listed here so an audit from this paragraph does not
# come up one short: it has no pinned major, so nginx:alpine already floats
# across majors on every rebuild of the web image. Excluding it changes
# nothing; pinning it is a separate decision from this one. All four tags pick
# up upstream patch rebuilds whenever the image is rebuilt.

version: 2

updates:
  # ── Python: the deploy manifest and its dev/pipeline superset ──────────────
  # One entry covers both requirements.txt and requirements-dev.txt — the pip
  # ecosystem reads the requirements files in the directory, and the `-r
  # requirements.txt` at the top of requirements-dev.txt means a shared pin is
  # updated once, in the file that declares it.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # A no-op today, kept as a written-down assertion rather than a fix.
    #
    # It does NOT protect the `==` pins from being widened into ranges, which
    # an earlier version of this comment claimed. dependabot-core treats an
    # equality operator as deliberate under every strategy — widen_requirement_
    # range in python/.../requirements_updater.rb branches on equality first
    # and just substitutes the new version ("assume it's being used
    # deliberately"). Nothing turns `==1.2.3` into a range. On top of that,
    # `auto` resolves to BumpVersions here anyway: it picks WidenRanges only
    # for a library, and library? returns false without a pyproject.toml,
    # which this repo does not have.
    #
    # What it does buy: `auto` would flip to WidenRanges the day a
    # pyproject.toml appears, and BumpVersions is also the only strategy that
    # bumps the lower bound of a `>=` requirement. Neither applies to a file
    # that is all `==` with no pyproject beside it — but both are exactly the
    # kind of change someone makes without re-reading this file.
    versioning-strategy: increase

    # Above the default of 5. The groups below exist to make coupled bumps
    # arrive as one reviewable PR, and that only works if a slot is free when
    # the sweep runs. The ungrouped long tail is what crowds them out — yt-dlp
    # is date-versioned and ships often, and pinecone, cohere, groq,
    # google-cloud-storage, typing-extensions, requests, openai and pytest are
    # each on their own. Headroom is cheaper than a group PR that silently
    # never opens.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The coupling #37 documents, made reviewable. fastapi declares
      # `starlette>=0.46.0` with no upper bound and the resolver already walked
      # that to 1.3.1; api/limiter.py and api/routes.py import
      # starlette.requests.Request directly. A lone starlette PR is not
      # reviewable without the fastapi it has to land beside, and slowapi sits
      # on the same seam — it wraps starlette's request/response types, so a
      # starlette major without a matching slowapi is the same failure.
      #
      # limits joins the group for the mirror-image reason (#41): slowapi wraps
      # starlette on one side and limits on the other, resolving limits'
      # strategy and storage by string name, and declares `limits>=2.3`
      # unbounded. A limits PR alone is not reviewable without the slowapi it
      # runs under, and grouping also keeps it off the ungrouped long tail the
      # open-pull-requests-limit note below is about.
      fastapi-stack:
        patterns:
          - fastapi
          - starlette
          - uvicorn*
          - pydantic*
          - slowapi
          - limits
      # Same argument one layer up: langchain-core 1.5.1 sits exactly on the
      # floor langchain-openai declares, and the integration packages
      # (langchain-groq, langchain-pinecone) track the core release train.
      # Bumping one alone is how the floor conflicts in #37 get discovered the
      # hard way.
      langchain:
        patterns:
          - langchain*
          - langgraph
          - langsmith
      # The long tail, collapsed. This is the group the open-pull-requests-limit
      # note above describes the absence of: on the first sweep, yt-dlp,
      # requests, pinecone, google-cloud-storage, groq, pytest, cohere and
      # openai each arrived as their own PR — eight of the ten slots, none of
      # them individually interesting.
      #
      # Those eight are what the first sweep happened to move, not the whole
      # tail. Derived from both requirements files against the two groups
      # above, this catch-all actually collects eleven: the eight named, plus
      # typing-extensions, youtube-transcript-api and python-dotenv. The limit
      # comment above lists a third variant again. None of the three is wrong
      # for what it describes — sweep, membership, and crowding are different
      # questions — so reconcile them by re-deriving from the manifests rather
      # than by editing one list to match another.
      #
      # Must stay last among the pip groups. A dependency joins the first group
      # whose patterns match, in the order groups are written here, so a `*`
      # pattern above fastapi-stack or langchain would swallow both and undo
      # the coupling they exist to preserve. It is deliberately not restated as
      # exclude-patterns: duplicating those two lists here would be a second
      # place to keep in sync, and ordering already decides it.
      #
      # Minor and patch only, so every major still arrives alone. That is the
      # same line the frontend-tooling group draws, and for the same reason —
      # a major is not a review-by-reading change, and this file's whole
      # premise is that the diff is where a bump gets judged.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Two majors that cannot be taken at all, not two we would rather defer.
    # The langchain integration packages cap them, and in both cases the
    # capping version is the newest one published — there is no combination of
    # releases that resolves, so the PR is unmergeable the moment it opens:
    #
    #   langchain-pinecone 0.2.13  →  pinecone[asyncio]>=6.0.0,<8.0.0
    #   langchain-groq     1.1.3   →  groq>=0.30.0,<1.0.0
    #
    # Both were opened on the first sweep (#63 pinecone 9.1.0, #65 groq 1.6.0)
    # and both failed CI at the pip resolve step with ResolutionImpossible.
    # Without this block they reopen every Monday and burn two of the ten PR
    # slots the limit above exists to protect.
    #
    # Scoped to majors on purpose, not a blanket dependency-name ignore.
    # Dependabot reads 0.37.1 → 1.6.0 as a major and 0.37.1 → 0.38.0 as a
    # minor, so groq keeps flowing inside the 0.x range langchain-groq allows,
    # and pinecone keeps flowing inside 7.x. Only the jump over the cap stops.
    #
    # The cost, corrected. An earlier version of this comment said an ignore
    # also suppresses *security* PRs for the versions it covers, and that a CVE
    # fixed only in pinecone 8+ or groq 1.x would therefore arrive as silence.
    # That is wrong for the form used here, and wrong in the direction that
    # matters — it understated the coverage this repo actually has.
    #
    # An ignore condition scoped by `update-types` reaches version updates only:
    #
    #   "update-types only affects version updates, not security updates."
    #   — GitHub, Dependabot options reference
    #
    # The value itself says so: `version-update:semver-major` is namespaced to
    # version updates. The sibling `versions:` key is the one that does reach
    # security updates, and neither block in this file uses it. So a CVE whose
    # only fix ships above the cap still arrives as a security PR — it just
    # arrives red, failing the same pip resolve #63 and #65 failed, because the
    # ceiling is upstream and an advisory does not move it. Loud and blocked,
    # not silent. Deleting the entry would not help; raising the cap upstream
    # is the only thing that does.
    #
    # One case this does not cover, noted so the rule is not over-read:
    # dependabot-core#4027 reports vulnerable packages going un-updated when
    # *every* semver type is ignored, which is plausible since nothing is left
    # to bump to. Ignoring majors alone is not that case.
    #
    # Security PRs are also exempt from open-pull-requests-limit — they neither
    # count toward it nor are capped by it — so the slot argument above is
    # about the scheduled sweep only.
    #
    # Delete the matching entry as soon as langchain-pinecone or langchain-groq
    # raises its ceiling. Nothing here re-checks that: this is a snapshot of an
    # upstream constraint on 2026-07-28, and it stays in force until edited.
    ignore:
      - dependency-name: pinecone
        update-types:
          - version-update:semver-major
      - dependency-name: groq
        update-types:
          - version-update:semver-major

  # ── GitHub Actions used by ci.yml ─────────────────────────────────────────
  # These are pinned to floating majors (actions/checkout@v4), so only a major
  # release produces a PR — a handful a year. One grouped PR, since they are
  # reviewed as "does CI still pass", not one at a time.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # ── Frontend ──────────────────────────────────────────────────────────────
  # frontend/package-lock.json is as frozen as requirements.txt and had the
  # same problem. Grouped by what has to move together, with majors deliberately
  # left ungrouped so each arrives as its own reviewable PR.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday

    # Matched to pip's, and recorded here because the reasoning above it was
    # only ever written down for pip while this entry sat on the default 5.
    # The failure mode is the same one and it is silent: a group PR that has
    # no slot left does not open, and nothing reports that it did not.
    #
    # Not tuned lower to reflect the smaller surface, deliberately. This is a
    # ceiling, not a budget — it costs nothing until it binds, and the only
    # thing a lower number buys is a higher chance of the silent failure. The
    # actual volume control is the grouping below, not this line.
    #
    # Scope, now that it has been checked rather than assumed: *security* PRs
    # neither count toward this limit nor are capped by it. So this governs the
    # Monday sweep only, and an advisory wave — the seven of #44–#50 — arrives
    # whatever this says.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # react, react-dom and their @types move as a unit — a React major with
      # last major's @types typechecks against the wrong API, and `npm run
      # build` is `tsc -b && vite build`, so that fails the frontend CI job
      # rather than showing up at runtime. Majors stay in the group for exactly
      # that reason.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Build tooling, minor and patch only. A vite or typescript major changes
      # the build contract and gets its own PR.
      #
      # `tailwindcss` and `@tailwindcss/*` are listed together on purpose: since
      # #76 the PostCSS plugin is a separate package that upstream versions in
      # lockstep with the framework, so splitting them across two PRs would let
      # one land without the other and mismatch the pair. `autoprefixer` came
      # off this list in the same change — v4 handles vendor prefixing, so it is
      # no longer a dependency.
      frontend-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - tailwindcss
          - "@tailwindcss/*"
          - postcss
          - "@types/node"
        update-types:
          - minor
          - patch
      # The same long-tail catch as the pip block, and last for the same
      # ordering reason — but read this one as forward-looking rather than as
      # a fix. It is a no-op today: frontend/package.json declares twelve
      # entries (2 dependencies + 10 devDependencies), of which eleven are
      # already grouped — four in react, seven in frontend-tooling — and the
      # twelfth is @playwright/test, excluded below on purpose. It exists so
      # the *next* dependency added to this frontend does not arrive ungrouped
      # by default, which is how the pip long tail accumulated.
      frontend-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/test"
        update-types:
          - minor
          - patch
    # @playwright/test is intentionally in no group, and is excluded from the
    # catch-all above to keep it that way. ci.yml caches browser binaries keyed
    # on its exact version, so a Playwright bump is also a cache miss and a
    # browser reinstall — worth seeing on its own.

    # What none of these groups touch: *security* updates. A group applies to
    # version updates unless it declares `applies-to: security-updates`, and
    # none here does. That is why seven of the first sweep's ungrouped PRs
    # (#44–#50) were ungrouped whatever this file said — they were alert-driven,
    # not scheduled.
    #
    # Left that way deliberately. Grouping security updates would mean one
    # unmergeable package holds up every other advisory in the same batch, and
    # an advisory PR is the one case where the smallest possible diff, mergeable
    # on its own, is worth more than a tidy inbox. If the volume ever justifies
    # revisiting, the knob is a second group entry with applies-to:
    # security-updates — not a change to the ones above.

    # The parked-decisions block that sat here is now empty, which is worth
    # recording rather than deleting silently. Two npm majors were withheld by
    # `ignore` while the migrations they actually required got done, and both
    # have since landed:
    #
    #   tailwindcss 3.4.19 → 4.x   #58, migrated in #76
    #   typescript  5.9.3  → 7.x   #62, verified in #77
    #
    # Neither Dependabot PR was wrong; both were incomplete in the same way,
    # editing only package.json and the lockfile because that is all Dependabot
    # edits. For tailwind that could not build — v4 does not read
    # tailwind.config.ts and does not recognise the `@tailwind` directives in
    # src/index.css, so postcss.config.js and both of those had to move in the
    # same commit. For typescript the bump was complete as proposed, but 7.0 is
    # a reimplemented compiler rather than a feature release, so it wanted a
    # deliberate verification pass rather than a green `tsc -b` read as
    # sufficient.
    #
    # Two findings outlive the entries. From #77: the typescript npm package no
    # longer ships a language service, so nothing here governs what an editor
    # runs — CI and the editor are two different compilers by construction now,
    # not by drift. From #76: tailwind v4 documents a Safari 16.4 floor, and its
    # own @supports shim covers every @property it registers, but that shim is
    # not the whole story — v4 also emits spacing as logical shorthands over a
    # `--spacing` base, which Lightning CSS cannot downlevel while a var() is
    # inside, so Safari 14.0 dropped them. The migration held the floor pinned
    # in #91 only because index.css pins the spacing steps in @theme inline as
    # well; scripts/check-css-floor.mjs is what keeps that true. Read a "v4 is
    # compatible" claim as covering the shim alone unless the build output says
    # otherwise.
    #
    # Both majors flow again, ungrouped: frontend-tooling above excludes majors
    # by update-types, so a tailwind 5 or typescript 8 still arrives as its own
    # PR, to be judged the way these two were. That is this block's whole
    # lifecycle run end to end, and it is the opposite of the pip ignore above
    # — that one waits on an upstream ceiling nobody here controls and stays
    # until langchain-pinecone or langchain-groq moves; these waited on a
    # decision this repo owns, and so they went away.
    #
    # There is deliberately no `ignore:` key for npm now. If a future major
    # needs parking, the shape to copy is the pip block above, and the rule
    # that made these two safe to park is worth restating: an `update-types`
    # ignore reaches version updates only, so a CVE fixed only above the pin
    # still opens a security PR. That PR arrives mergeable-looking and may not
    # be — which is why the trigger to act is the tracking issue, not this file.
