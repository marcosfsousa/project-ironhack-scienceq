# Watches the pinned dependency manifests for successor releases (#40).
#
# Why this file exists: #37 pinned the last four floating direct imports, and
# the rest of requirements.txt was already pinned. Pinning is the right call —
# a silent major bump landing in the serving image on a rebuild is the worse
# failure — but it only pays if something notices when a successor ships.
# Before this file, nothing did: every version in the deploy manifest stayed
# frozen until a human edited the line.
#
# This file is only half the coverage, and the half it is not lives outside
# the repo. It configures *version* updates: the scheduled sweep below, which
# opens a PR when a newer release exists, whatever the reason for it.
# *Security* updates — the immediate PR triggered by a Dependabot alert on a
# published CVE — are a repository setting under Settings → Code security, not
# a config file, so nothing here can assert or restore them. Both alerts and
# security updates were switched on for this repo on 2026-07-28, alongside this
# commit; before that they were off, which meant a CVE published on a Tuesday
# waited for the Monday sweep. If that toggle is ever flipped back, this file
# silently degrades to exactly that six-day worst case rather than failing.
#
# Base images are deliberately not watched. The inventory is four FROM lines
# across three files, not three — Dockerfile.web is multi-stage:
#
#   Dockerfile           python:3.11-slim
#   Dockerfile.pipeline  python:3.11-slim
#   Dockerfile.web       node:20-alpine   (build stage)
#   Dockerfile.web       nginx:alpine     (runtime stage — what actually serves)
#
# The pythons and the node carry a deliberate major, chosen to match a runtime
# rather than to track latest: Cloud Run's Python, and the Node that ci.yml's
# setup-node pins. A bot proposing 3.12 or node 22 is proposing a runtime
# migration, not applying a patch, so that stays a human decision. nginx is
# the odd one out and is listed here so an audit from this paragraph does not
# come up one short: it has no pinned major, so nginx:alpine already floats
# across majors on every rebuild of the web image. Excluding it changes
# nothing; pinning it is a separate decision from this one. All four tags pick
# up upstream patch rebuilds whenever the image is rebuilt.

version: 2

updates:
  # ── Python: the deploy manifest and its dev/pipeline superset ──────────────
  # One entry covers both requirements.txt and requirements-dev.txt — the pip
  # ecosystem reads the requirements files in the directory, and the `-r
  # requirements.txt` at the top of requirements-dev.txt means a shared pin is
  # updated once, in the file that declares it.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # A no-op today, kept as a written-down assertion rather than a fix.
    #
    # It does NOT protect the `==` pins from being widened into ranges, which
    # an earlier version of this comment claimed. dependabot-core treats an
    # equality operator as deliberate under every strategy — widen_requirement_
    # range in python/.../requirements_updater.rb branches on equality first
    # and just substitutes the new version ("assume it's being used
    # deliberately"). Nothing turns `==1.2.3` into a range. On top of that,
    # `auto` resolves to BumpVersions here anyway: it picks WidenRanges only
    # for a library, and library? returns false without a pyproject.toml,
    # which this repo does not have.
    #
    # What it does buy: `auto` would flip to WidenRanges the day a
    # pyproject.toml appears, and BumpVersions is also the only strategy that
    # bumps the lower bound of a `>=` requirement. Neither applies to a file
    # that is all `==` with no pyproject beside it — but both are exactly the
    # kind of change someone makes without re-reading this file.
    versioning-strategy: increase

    # Above the default of 5. The groups below exist to make coupled bumps
    # arrive as one reviewable PR, and that only works if a slot is free when
    # the sweep runs. The ungrouped long tail is what crowds them out — yt-dlp
    # is date-versioned and ships often, and pinecone, cohere, groq,
    # google-cloud-storage, typing-extensions, requests, openai and pytest are
    # each on their own. Headroom is cheaper than a group PR that silently
    # never opens.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The coupling #37 documents, made reviewable. fastapi declares
      # `starlette>=0.46.0` with no upper bound and the resolver already walked
      # that to 1.3.1; api/limiter.py and api/routes.py import
      # starlette.requests.Request directly. A lone starlette PR is not
      # reviewable without the fastapi it has to land beside, and slowapi sits
      # on the same seam — it wraps starlette's request/response types, so a
      # starlette major without a matching slowapi is the same failure.
      fastapi-stack:
        patterns:
          - fastapi
          - starlette
          - uvicorn*
          - pydantic*
          - slowapi
      # Same argument one layer up: langchain-core 1.5.1 sits exactly on the
      # floor langchain-openai declares, and the integration packages
      # (langchain-groq, langchain-pinecone) track the core release train.
      # Bumping one alone is how the floor conflicts in #37 get discovered the
      # hard way.
      langchain:
        patterns:
          - langchain*
          - langgraph
          - langsmith

  # ── GitHub Actions used by ci.yml ─────────────────────────────────────────
  # These are pinned to floating majors (actions/checkout@v4), so only a major
  # release produces a PR — a handful a year. One grouped PR, since they are
  # reviewed as "does CI still pass", not one at a time.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # ── Frontend ──────────────────────────────────────────────────────────────
  # frontend/package-lock.json is as frozen as requirements.txt and had the
  # same problem. Grouped by what has to move together, with majors deliberately
  # left ungrouped so each arrives as its own reviewable PR.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      # react, react-dom and their @types move as a unit — a React major with
      # last major's @types typechecks against the wrong API, and `npm run
      # build` is `tsc -b && vite build`, so that fails the frontend CI job
      # rather than showing up at runtime. Majors stay in the group for exactly
      # that reason.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Build tooling, minor and patch only. A vite or typescript major changes
      # the build contract and gets its own PR.
      frontend-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - tailwindcss
          - postcss
          - autoprefixer
          - "@types/node"
        update-types:
          - minor
          - patch
    # @playwright/test is intentionally in no group. ci.yml caches browser
    # binaries keyed on its exact version, so a Playwright bump is also a cache
    # miss and a browser reinstall — worth seeing on its own.
