services:

  # ── FastAPI service ───────────────────────────────────────────────────────────
  # Phase 4 serving app — the target for Cloud Run.
  # Run: docker compose up api   →   http://localhost:8080
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8080"

  # ── Batch pipeline ────────────────────────────────────────────────────────────
  # Uses 'pipeline' profile so it does NOT start with 'docker compose up'.
  # Run explicitly: docker compose run pipeline [--full | --steps <steps>]
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    env_file: .env
    volumes:
      # the pipeline writes its outputs here. The api service does not mount
      # data/ — it bakes data/metadata.json at build time (see Dockerfile), so
      # rebuild the api image to serve a freshly-built corpus.
      - ./data:/app/data
    profiles:
      - pipeline
