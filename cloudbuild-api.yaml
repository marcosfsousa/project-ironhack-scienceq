steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/scienceq-prod/cloud-run-source-deploy/scienceq-api:$COMMIT_SHA
      - -t
      - europe-west1-docker.pkg.dev/scienceq-prod/cloud-run-source-deploy/scienceq-api:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - europe-west1-docker.pkg.dev/scienceq-prod/cloud-run-source-deploy/scienceq-api:$COMMIT_SHA

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - europe-west1-docker.pkg.dev/scienceq-prod/cloud-run-source-deploy/scienceq-api:latest

  # Observability tracing is OFF in production (issue #17): real user questions
  # must not be sent to the third-party observability platform (LangSmith).
  # These flags are set here so this deploy step is the authoritative record and
  # every deploy RE-ASSERTS THEM — a console edit that flips a flag survives only
  # until the next deploy. Because both the auto-tracer and the manual trace-write
  # (via TRACING_ENABLED) are gated on these flags, tracing stays off even if a
  # LANGSMITH_API_KEY were re-attached. Note the deploy re-asserts the FLAGS, not
  # keylessness: a re-attached key would persist across deploys, so the key check
  # in the verification below is the second layer and must be done by hand.
  # --update-env-vars MERGES (it does not replace the service's other env vars,
  # e.g. GROQ/COHERE/PINECONE keys set out-of-band). Development and evaluation
  # environments keep tracing on via their own .env.
  #
  # Post-deploy verification (record the result when this ships):
  #   gcloud run services describe scienceq-api --region=europe-west1 \
  #     --project=scienceq-prod \
  #     --format='value(spec.template.spec.containers[0].env)'
  #   → confirm LANGCHAIN_TRACING_V2=false and LANGSMITH_TRACING=false, and that
  #     no LANGSMITH_API_KEY is bound to the service (env or secret).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - scienceq-api
      - --image=europe-west1-docker.pkg.dev/scienceq-prod/cloud-run-source-deploy/scienceq-api:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --allow-unauthenticated
      - --project=scienceq-prod
      - --update-env-vars=LANGCHAIN_TRACING_V2=false,LANGSMITH_TRACING=false
      # The residential proxy was removed in issue #16. IPROYAL_PROXY_URL was
      # bound to the service out-of-band (it was never in this file) as a
      # Secret Manager reference, and because the env-var flags MERGE, it would
      # otherwise survive every future deploy — deleting the code path alone
      # leaves a live credential bound to the service. Re-asserted on every
      # deploy, so a console edit re-adding it survives only until the next one.
      #
      # That last guarantee holds only while traffic follows LATEST. On
      # 25 July 2026 traffic was pinned to a specific revision, so newly
      # deployed revisions served 0% and this flag's effect never reached
      # production. If traffic is pinned again, re-asserting here changes the
      # revision but not what users hit.
      #
      # Idempotent: verified 25 July 2026 against a service whose binding was
      # already removed — exits 0 and creates a clean revision rather than
      # erroring on the absent key, so this flag is safe to leave in place
      # permanently.
      #
      # It must be --remove-secrets, NOT --remove-env-vars. The variable is
      # secret-backed, and --remove-env-vars only removes plain values: against
      # a secret-backed binding it exits 0 having changed nothing, which reads
      # as a guarantee while providing none. --remove-secrets takes the
      # environment variable's name, not the underlying secret's name.
      #
      # Unbinding here does NOT revoke the credential — it only detaches it
      # from this service. The secret itself was destroyed in Secret Manager on
      # 25 July 2026 (verified: `gcloud secrets list --project=scienceq-prod`
      # returns COHERE / GROQ / LANGSMITH / PINECONE only). Cancelling the plan
      # with IPRoyal is a billing step outside this project's control.
      #
      # Post-deploy verification (record the result when this ships):
      #   gcloud run services describe scienceq-api --region=europe-west1 \
      #     --project=scienceq-prod \
      #     --flatten="spec.template.spec.containers[].env[]" \
      #     --format="table(spec.template.spec.containers.env.name,
      #                     spec.template.spec.containers.env.valueFrom.secretKeyRef.name)"
      #   → confirm IPROYAL_PROXY_URL appears in neither column. Use this form,
      #     not 'value(...env[].name)': a secret-backed variable still shows up
      #     under env[].name, so that shorter check cannot tell a live binding
      #     from a removed one. Never print the unfiltered env format — it
      #     renders plain env vars' actual secret values.
      - --remove-secrets=IPROYAL_PROXY_URL

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - services
      - add-iam-policy-binding
      - scienceq-api
      - --region=europe-west1
      - --member=allUsers
      - --role=roles/run.invoker
      - --project=scienceq-prod

options:
  logging: CLOUD_LOGGING_ONLY
