[pytest]
# Declares where the suite lives, so a bare `pytest` from the repo root collects
# the same set as `pytest tests/` by declaration rather than by accident of the
# tree layout. testpaths supplies default arguments only when pytest is invoked
# from the rootdir -- from a subdirectory, collection still starts at cwd.
#
# Having a config file at all also pins rootdir (and with it the default
# confcutdir) rather than leaving it inferred from the invocation arguments.
# That buys determinism, not a change in import behaviour: tests/conftest.py
# bootstraps sys.path off __file__, independent of rootdir either way.
#
# testpaths names a directory, not a file list -- a new test file under tests/
# needs no registration anywhere and this declaration cannot go stale.
testpaths = tests
