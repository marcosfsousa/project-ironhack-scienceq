[pytest]
# Declares where the suite lives, so a bare `pytest` collects the same set as
# `pytest tests/` by declaration rather than by accident of the tree layout.
# This also pins rootdir, which is otherwise inferred from the invocation
# arguments and changes conftest.py resolution depending on how pytest was run.
#
# testpaths names a directory, not a file list -- a new test file under tests/
# needs no registration anywhere and this declaration cannot go stale.
testpaths = tests
